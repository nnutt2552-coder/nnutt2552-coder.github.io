<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>งานคงค้าง - ระบบจดบันทึกงานโรงเรียน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://tapsfxknoiesanwiamuu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhcHNmeGtub2llc2Fud2lhbXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MDYzNzcsImV4cCI6MjEwODQ4MjM3N30.3PC9BkOrd4vUz3tjw4Mou-KEkd0X_jg7Ylx4E_kqjEw';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [activeTab, setActiveTab] = React.useState('pending');
            const [todos, setTodos] = React.useState([]);
            const [subjects, setSubjects] = React.useState([]);
            const [teachers, setTeachers] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            // Modal & Form States
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [editingTask, setEditingTask] = React.useState(null);
            const [viewingTask, setViewingTask] = React.useState(null);
            const [completingTask, setCompletingTask] = React.useState(null);

            // Form Fields
            const [title, setTitle] = React.useState('');
            const [description, setDescription] = React.useState('');
            const [subject, setSubject] = React.useState('');
            const [teacher, setTeacher] = React.useState('');
            const [dueDate, setDueDate] = React.useState('');
            const [links, setLinks] = React.useState(['']);
            const [files, setFiles] = React.useState(['']);

            // Completion Fields
            const [compNotes, setCompNotes] = React.useState('');

            // Search & Filters
            const [searchQuery, setSearchQuery] = React.useState('');
            const [filterStarred, setFilterStarred] = React.useState(false);
            const [completedSort, setCompletedSort] = React.useState('latest');

            // โหลดข้อมูลและตั้งค่า Real-time
            React.useEffect(() => {
                fetchData();

                const channel = supabase.channel('realtime-todos')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => {
                        fetchTodos();
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'subjects' }, () => {
                        fetchSubjects();
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'teachers' }, () => {
                        fetchTeachers();
                    })
                    .subscribe();

                return () => {
                    supabase.removeChannel(channel);
                };
            }, []);

            const fetchData = async () => {
                setLoading(true);
                await Promise.all([fetchTodos(), fetchSubjects(), fetchTeachers()]);
                setLoading(false);
            };

            const fetchTodos = async () => {
                const { data, error } = await supabase.from('todos').select('*').order('created_at', { ascending: false });
                if (!error) setTodos(data || []);
            };

            const fetchSubjects = async () => {
                const { data, error } = await supabase.from('subjects').select('*');
                if (!error) setSubjects(data || []);
            };

            const fetchTeachers = async () => {
                const { data, error } = await supabase.from('teachers').select('*');
                if (!error) setTeachers(data || []);
            };

            const getPriorityInfo = (dueDateStr) => {
                const today = new Date();
                today.setHours(0,0,0,0);
                const due = new Date(dueDateStr);
                due.setHours(0,0,0,0);
                const diffTime = due - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays <= 3) return { days: diffDays, color: 'bg-black text-white border-2 border-red-600', label: `เหลือ ${diffDays} วัน` };
                if (diffDays <= 7) return { days: diffDays, color: 'bg-red-600 text-white', label: `เหลือ ${diffDays} วัน` };
                if (diffDays <= 14) return { days: diffDays, color: 'bg-orange-500 text-white', label: `เหลือ ${diffDays} วัน` };
                if (diffDays <= 21) return { days: diffDays, color: 'bg-yellow-400 text-slate-900', label: `เหลือ ${diffDays} วัน` };
                if (diffDays <= 30) return { days: diffDays, color: 'bg-green-500 text-white', label: `เหลือ ${diffDays} วัน` };
                return { days: diffDays, color: 'bg-white text-slate-700 border border-slate-200', label: `เหลือ ${diffDays} วัน` };
            };

            const handleSaveTask = async (saveAsDraft = false) => {
                if (!title || !subject || !teacher || !dueDate) {
                    alert('กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน');
                    return;
                }

                if (!subjects.some(s => s.name === subject)) {
                    await supabase.from('subjects').insert([{ name: subject }]);
                }
                if (!teachers.some(t => t.name === teacher)) {
                    await supabase.from('teachers').insert([{ name: teacher }]);
                }

                const taskData = {
                    title,
                    description,
                    subject,
                    teacher,
                    due_date: dueDate,
                    is_draft: saveAsDraft,
                    updated_at: new Date()
                };

                if (editingTask) {
                    await supabase.from('todos').update(taskData).eq('id', editingTask.id);
                } else {
                    await supabase.from('todos').insert([taskData]);
                }

                closeModal();
                fetchData();
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingTask(null);
                setTitle('');
                setDescription('');
                setSubject('');
                setTeacher('');
                setDueDate('');
            };

            const openEditModal = (task) => {
                setEditingTask(task);
                setTitle(task.title);
                setDescription(task.description || '');
                setSubject(task.subject);
                setTeacher(task.teacher);
                setDueDate(task.due_date);
                setIsModalOpen(true);
            };

            const moveToTrash = async (id) => {
                if (confirm('คุณต้องการย้ายงานนี้ไปที่ถังขยะใช่หรือไม่?')) {
                    await supabase.from('todos').update({ is_deleted: true, deleted_at: new Date() }).eq('id', id);
                    fetchData();
                }
            };

            const toggleStar = async (id, currentStatus) => {
                await supabase.from('todos').update({ is_starred: !currentStatus }).eq('id', id);
                fetchData();
            };

            const handleCompleteConfirm = async () => {
                if (!completingTask) return;
                await supabase.from('todos').update({
                    is_completed: true,
                    completed_at: new Date(),
                    completion_notes: compNotes
                }).eq('id', completingTask.id);

                setCompletingTask(null);
                setCompNotes('');
                fetchData();
            };

            const restoreFromTrash = async (id) => {
                await supabase.from('todos').update({ is_deleted: false, deleted_at: null }).eq('id', id);
                fetchData();
            };

            const deletePermanent = async (id) => {
                if (confirm('ต้องการลบงานนี้อย่างถาวร?')) {
                    await supabase.from('todos').delete().eq('id', id);
                    fetchData();
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6 pb-24 md:pb-10">
                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-2">
                                📋 งานคงค้าง <span className="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-semibold">Real-time Connected</span>
                            </h1>
                            <p className="text-slate-500 text-sm mt-1">ระบบจดบันทึกการบ้านและงานวิชาการ ม.ปลาย</p>
                        </div>
                        <button 
                            onClick={() => setIsModalOpen(true)}
                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl font-medium shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                            ➕ เพิ่มงานใหม่
                        </button>
                    </header>

                    <div className="flex overflow-x-auto gap-2 mb-6 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
                        {[
                            { id: 'pending', label: 'งานค้าง', count: todos.filter(t => !t.is_completed && !t.is_deleted).length },
                            { id: 'completed', label: 'เสร็จแล้ว', count: todos.filter(t => t.is_completed && !t.is_deleted).length },
                            { id: 'subjects', label: 'รายวิชา', count: subjects.length },
                            { id: 'trash', label: 'ถังขยะ', count: todos.filter(t => t.is_deleted).length },
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap transition-all ${
                                    activeTab === tab.id 
                                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' 
                                        : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                {tab.label}
                                <span className={`text-xs px-2 py-0.5 rounded-full ${activeTab === tab.id ? 'bg-indigo-500 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                    {tab.count}
                                </span>
                            </button>
                        ))}
                    </div>

                    <main>
                        {loading ? (
                            <div className="text-center py-12 text-slate-400">กำลังโหลดข้อมูล...</div>
                        ) : activeTab === 'pending' ? (
                            <div>
                                <div className="flex flex-col sm:flex-row gap-4 mb-6">
                                    <input 
                                        type="text" 
                                        placeholder="ค้นหาชื่องาน, วิชา, หรือครูผู้สอน..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="flex-1 px-4 py-3 bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm"
                                    />
                                    <button 
                                        onClick={() => setFilterStarred(!filterStarred)}
                                        className={`px-4 py-3 rounded-xl font-medium text-sm border flex items-center gap-2 transition-all ${
                                            filterStarred ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                                        }`}
                                    >
                                        ★ งานติดดาว
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {todos
                                        .filter(t => !t.is_completed && !t.is_deleted)
                                        .filter(t => filterStarred ? t.is_starred : true)
                                        .filter(t => 
                                            t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                            t.subject.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                            t.teacher.toLowerCase().includes(searchQuery.toLowerCase())
                                        )
                                        .map(task => {
                                            const priority = getPriorityInfo(task.due_date);
                                            return (
                                                <div key={task.id} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between relative">
                                                    <button 
                                                        onClick={() => toggleStar(task.id, task.is_starred)}
                                                        className="absolute top-4 right-4 text-slate-300 hover:text-amber-500 text-xl"
                                                    >
                                                        {task.is_starred ? '★' : '☆'}
                                                    </button>

                                                    <div>
                                                        <div className="flex items-center gap-2 mb-3 pr-12">
                                                            <span className={`text-xs px-3 py-1 rounded-full font-bold ${priority.color}`}>
                                                                {priority.label}
                                                            </span>
                                                            {task.is_draft && <span className="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded">โครงร่าง</span>}
                                                        </div>
                                                        <h3 onClick={() => setViewingTask(task)} className="font-bold text-slate-900 text-lg mb-2 cursor-pointer hover:text-indigo-600">
                                                            {task.title}
                                                        </h3>
                                                        <p className="text-slate-500 text-sm mb-4 line-clamp-2">{task.description || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                                                        
                                                        <div className="space-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-3 mb-4">
                                                            <div>📘 วิชา: <span className="font-medium text-slate-800">{task.subject}</span></div>
                                                            <div>👨‍🏫 ครูผู้สอน: <span className="font-medium text-slate-800">{task.teacher}</span></div>
                                                            <div>📅 กำหนดส่ง: <span className="font-medium text-slate-800">{task.due_date}</span></div>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-2 pt-2 border-t border-slate-100">
                                                        <button 
                                                            onClick={() => setCompletingTask(task)}
                                                            className="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 py-2 rounded-xl text-xs font-semibold"
                                                        >
                                                            ✓ เสร็จแล้ว
                                                        </button>
                                                        <button 
                                                            onClick={() => openEditModal(task)}
                                                            className="px-3 py-2 hover:bg-slate-100 text-slate-500 rounded-xl text-xs font-semibold"
                                                        >
                                                            แก้ไข
                                                        </button>
                                                        <button 
                                                            onClick={() => moveToTrash(task.id)}
                                                            className="px-3 py-2 hover:bg-red-50 text-red-500 rounded-xl text-xs font-semibold"
                                                        >
                                                            ลบ
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>
                        ) : activeTab === 'completed' ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {todos.filter(t => t.is_completed && !t.is_deleted).map(task => (
                                    <div key={task.id} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                                        <span className="text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-bold">✓ เสร็จแล้ว</span>
                                        <h3 className="font-bold text-slate-900 text-lg my-2">{task.title}</h3>
                                        <div className="text-xs text-slate-500">วิชา: {task.subject} | ครู: {task.teacher}</div>
                                        {task.completion_notes && <div className="text-xs text-emerald-600 mt-2 italic">"{task.completion_notes}"</div>}
                                    </div>
                                ))}
                            </div>
                        ) : activeTab === 'subjects' ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {subjects.map(sub => (
                                    <div key={sub.id} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                        <h3 className="text-xl font-bold text-slate-900">{sub.name}</h3>
                                        <p className="text-sm text-slate-500 mt-2">งานทั้งหมด: {todos.filter(t => t.subject === sub.name && !t.is_deleted).length} งาน</p>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {todos.filter(t => t.is_deleted).map(task => (
                                    <div key={task.id} className="bg-white rounded-2xl p-5 shadow-sm border border-red-100 flex flex-col justify-between">
                                        <h3 className="font-bold text-slate-900 text-lg">{task.title}</h3>
                                        <div className="flex items-center gap-2 mt-4">
                                            <button onClick={() => restoreFromTrash(task.id)} className="flex-1 bg-indigo-50 text-indigo-700 py-2 rounded-xl text-xs font-semibold">กู้คืน</button>
                                            <button onClick={() => deletePermanent(task.id)} className="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-xs font-semibold">ลบถาวร</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* MODAL เพิ่ม/แก้ไข */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl">
                                <h2 className="text-xl font-bold text-slate-900 mb-4">{editingTask ? 'แก้ไขงาน' : 'เพิ่มงานใหม่'}</h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">ชื่องาน *</label>
                                        <input type="text" value={title} onChange={e => setTitle(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="เช่น การบ้านฟิสิกส์" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">รายวิชา *</label>
                                        <input type="text" value={subject} onChange={e => setSubject(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="เช่น ฟิสิกส์" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">ครูผู้สอน *</label>
                                        <input type="text" value={teacher} onChange={e => setTeacher(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="เช่น ครูสมชาย" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">วันกำหนดส่ง *</label>
                                        <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">รายละเอียดเพิ่มเติม</label>
                                        <textarea value={description} onChange={e => setDescription(e.target.value)} rows="3" className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="รายละเอียด..."></textarea>
                                    </div>
                                </div>
                                <div className="flex items-center justify-end gap-3 mt-6">
                                    <button onClick={closeModal} className="px-4 py-2.5 rounded-xl text-slate-600 text-sm">ยกเลิก</button>
                                    <button onClick={() => handleSaveTask(false)} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold">บันทึกงาน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL ยืนยันเสร็จ */}
                    {completingTask && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
                                <h2 className="text-xl font-bold text-slate-900 mb-2">ยืนยันงานเสร็จสมบูรณ์</h2>
                                <textarea value={compNotes} onChange={e => setCompNotes(e.target.value)} placeholder="โน้ตเพิ่มเติม (ถ้ามี)" className="w-full px-4 py-2.5 rounded-xl border text-sm" rows="3"></textarea>
                                <div className="flex items-center justify-end gap-3 mt-6">
                                    <button onClick={() => setCompletingTask(null)} className="px-4 py-2.5 rounded-xl text-slate-600 text-sm">ยกเลิก</button>
                                    <button onClick={handleCompleteConfirm} className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold">ยืนยัน</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
