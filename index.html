<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>งานคงค้าง - ระบบจดบันทึกงานโรงเรียน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-t-screen">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // ⚙️ ตั้งค่า SUPABASE (แทนที่ด้วยค่าของคุณจาก Step 1)
        // ==========================================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [activeTab, setActiveTab] = React.useState('pending'); // pending, completed, subjects, calendar, trash
            const [todos, setTodos] = React.useState([]);
            const [subjects, setSubjects] = React.useState([]);
            const [teachers, setTeachers] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            // Modal & Form States
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [editingTask, setEditingTask] = React.useState(null);
            const [viewingTask, setViewingTask] = React.useState(null);
            const [completingTask, setCompletingTask] = React.useState(null);

            // Form Fields
            const [title, setTitle] = React.useState('');
            const [description, setDescription] = React.useState('');
            const [subject, setSubject] = React.useState('');
            const [teacher, setTeacher] = React.useState('');
            const [dueDate, setDueDate] = React.useState('');
            const [links, setLinks] = React.useState(['']);
            const [files, setFiles] = React.useState(['']);
            const [isDraft, setIsDraft] = React.useState(false);

            // Completion Fields
            const [compNotes, setCompNotes] = React.useState('');
            const [compFiles, setCompFiles] = React.useState(['']);
            const [compLinks, setCompLinks] = React.useState(['']);

            // Search & Filters
            const [searchQuery, setSearchQuery] = React.useState('');
            const [filterStarred, setFilterStarred] = React.useState(false);
            const [completedSort, setCompletedSort] = React.useState('latest'); // latest, subject, teacher

            // โหลดข้อมูลจาก Supabase และตั้งค่า Real-time
            useEffect(() => {
                fetchData();

                // ตั้งค่า Real-time Subscription ให้ซิงค์ข้ามอุปกรณ์ทันที
                const channel = supabase.channel('realtime-todos')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => {
                        fetchTodos();
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'subjects' }, () => {
                        fetchSubjects();
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'teachers' }, () => {
                        fetchTeachers();
                    })
                    .subscribe();

                return () => {
                    supabase.removeChannel(channel);
                };
            }, []);

            const fetchData = async () => {
                setLoading(true);
                await Promise.all([fetchTodos(), fetchSubjects(), fetchTeachers()]);
                setLoading(false);
            };

            const fetchTodos = async () => {
                const { data, error } = await supabase.from('todos').select('*').order('created_at', { ascending: false });
                if (!error) setTodos(data || []);
            };

            const fetchSubjects = async () => {
                const { data, error } = await supabase.from('subjects').select('*');
                if (!error) setSubjects(data || []);
            };

            const fetchTeachers = async () => {
                const { data, error } = await supabase.from('teachers').select('*');
                if (!error) setTeachers(data || []);
            };

            // คำนวณวันเหลือ & สีลำดับความสำคัญ
            const getPriorityInfo = (dueDateStr) => {
                const today = new Date();
                today.setHours(0,0,0,0);
                const due = new Date(dueDateStr);
                due.setHours(0,0,0,0);
                const diffTime = due - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays <= 3) return { days: diffDays, color: 'bg-black text-white border-2 border-red-600', label: `เหลือ ${diffDays} วัน` };
                if (diffDays <= 7) return { days: diffDays, color: 'bg-red-600 text-white', label: `เหลือ ${diffDays} วัน` };
                if (diffDays <= 14) return { days: diffDays, color: 'bg-orange-500 text-white', label: `เหลือ ${diffDays} วัน` };
                if (diffDays <= 21) return { days: diffDays, color: 'bg-yellow-400 text-slate-900', label: `เหลือ ${diffDays} วัน` };
                if (diffDays <= 30) return { days: diffDays, color: 'bg-green-500 text-white', label: `เหลือ ${diffDays} วัน` };
                return { days: diffDays, color: 'bg-white text-slate-700 border border-slate-200', label: `เหลือ ${diffDays} วัน` };
            };

            // บันทึกงาน (เพิ่ม/แก้ไข/โครงร่าง)
            const handleSaveTask = async (saveAsDraft = false) => {
                if (!title || !subject || !teacher || !dueDate) {
                    alert('กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน');
                    return;
                }

                // ตรวจสอบและบันทึกวิชา/ครูใหม่ลง Master Table อัตโนมัติถ้ายังไม่มี
                if (!subjects.some(s => s.name === subject)) {
                    await supabase.from('subjects').insert([{ name: subject }]);
                }
                if (!teachers.some(t => t.name === teacher)) {
                    await supabase.from('teachers').insert([{ name: teacher }]);
                }

                const taskData = {
                    title,
                    description,
                    subject,
                    teacher,
                    due_date: dueDate,
                    links: links.filter(l => l.trim() !== ''),
                    files: files.filter(f => f.trim() !== ''),
                    is_draft: saveAsDraft,
                    updated_at: new Date()
                };

                if (editingTask) {
                    await supabase.from('todos').update(taskData).eq('id', editingTask.id);
                } else {
                    await supabase.from('todos').insert([taskData]);
                }

                closeModal();
                fetchData();
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingTask(null);
                setTitle('');
                setDescription('');
                setSubject('');
                setTeacher('');
                setDueDate('');
                setLinks(['']);
                setFiles(['']);
                setIsDraft(false);
            };

            const openEditModal = (task) => {
                setEditingTask(task);
                setTitle(task.title);
                setDescription(task.description || '');
                setSubject(task.subject);
                setTeacher(task.teacher);
                setDueDate(task.due_date);
                setLinks(task.links?.length ? task.links : ['']);
                setFiles(task.files?.length ? task.files : ['']);
                setIsDraft(task.is_draft);
                setIsModalOpen(true);
            };

            // ย้ายไปถังขยะ
            const moveToTrash = async (id) => {
                if (confirm('คุณต้องการย้ายงานนี้ไปที่ถังขยะใช่หรือไม่?')) {
                    await supabase.from('todos').update({ is_deleted: true, deleted_at: new Date() }).eq('id', id);
                    fetchData();
                }
            };

            // สลับสถานะติดดาว
            const toggleStar = async (id, currentStatus) => {
                await supabase.from('todos').update({ is_starred: !currentStatus }).eq('id', id);
                fetchData();
            };

            // ยืนยันงานเสร็จสมบูรณ์
            const handleCompleteConfirm = async () => {
                if (!completingTask) return;
                await supabase.from('todos').update({
                    is_completed: true,
                    completed_at: new Date(),
                    completion_notes: compNotes,
                    completion_files: compFiles.filter(f => f.trim() !== ''),
                    completion_links: compLinks.filter(l => l.trim() !== '')
                }).eq('id', completingTask.id);

                setCompletingTask(null);
                setCompNotes('');
                setCompFiles(['']);
                setCompLinks(['']);
                fetchData();
            };

            // กู้คืนจากถังขยะ
            const restoreFromTrash = async (id) => {
                await supabase.from('todos').update({ is_deleted: false, deleted_at: null }).eq('id', id);
                fetchData();
            };

            // ลบถาวร
            const deletePermanent = async (id) => {
                if (confirm('ต้องการลบงานนี้อย่างถาวร?')) {
                    await supabase.from('todos').delete().eq('id', id);
                    fetchData();
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6 pb-24 md:pb-10">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-2">
                                📋 งานคงค้าง <span className="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-semibold">Real-time Sync</span>
                            </h1>
                            <p className="text-slate-500 text-sm mt-1">ระบบจดบันทึกการบ้านและงานวิชาการ ม.ปลาย</p>
                        </div>
                        <button 
                            onClick={() => setIsModalOpen(true)}
                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl font-medium shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="plus" className="w-5 h-5"></i> เพิ่มงานใหม่
                        </button>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="flex overflow-x-auto gap-2 mb-6 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
                        {[
                            { id: 'pending', label: 'งานค้าง', icon: 'clock', count: todos.filter(t => !t.is_completed && !t.is_deleted).length },
                            { id: 'completed', label: 'เสร็จแล้ว', icon: 'check-circle-2', count: todos.filter(t => t.is_completed && !t.is_deleted).length },
                            { id: 'subjects', label: 'รายวิชา', icon: 'book-open', count: subjects.length },
                            { id: 'calendar', label: 'ปฏิทิน', icon: 'calendar', count: null },
                            { id: 'trash', label: 'ถังขยะ', icon: 'trash-2', count: todos.filter(t => t.is_deleted).length },
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap transition-all ${
                                    activeTab === tab.id 
                                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' 
                                        : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <i data-lucide={tab.icon} className="w-4 h-4"></i>
                                {tab.label}
                                {tab.count !== null && (
                                    <span className={`text-xs px-2 py-0.5 rounded-full ${activeTab === tab.id ? 'bg-indigo-500 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                        {tab.count}
                                    </span>
                                )}
                            </button>
                        ))}
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <main>
                        {/* 1. งานค้าง (Pending Tab) */}
                        {activeTab === 'pending' && (
                            <div>
                                <div className="flex flex-col sm:flex-row gap-4 mb-6">
                                    <div className="relative flex-1">
                                        <i data-lucide="search" className="absolute left-3.5 top-3.5 w-5 h-5 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="ค้นหาชื่องาน, วิชา, หรือครูผู้สอน..." 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-11 pr-4 py-3 bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm"
                                        />
                                    </div>
                                    <button 
                                        onClick={() => setFilterStarred(!filterStarred)}
                                        className={`px-4 py-3 rounded-xl font-medium text-sm border flex items-center gap-2 transition-all ${
                                            filterStarred ? 'bg-amber-500 text-white border-amber-500 shadow-sm' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                                        }`}
                                    >
                                        <i data-lucide="star" className={`w-4 h-4 ${filterStarred ? 'fill-current' : ''}`}></i>
                                        งานติดดาว
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {todos
                                        .filter(t => !t.is_completed && !t.is_deleted)
                                        .filter(t => filterStarred ? t.is_starred : true)
                                        .filter(t => 
                                            t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                            t.subject.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                            t.teacher.toLowerCase().includes(searchQuery.toLowerCase())
                                        )
                                        .map(task => {
                                            const priority = getPriorityInfo(task.due_date);
                                            return (
                                                <div key={task.id} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition-all relative">
                                                    {task.is_draft && (
                                                        <span className="absolute top-4 right-14 bg-slate-200 text-slate-700 text-xs px-2.5 py-1 rounded-md font-semibold">
                                                            โครงร่าง (Draft)
                                                        </span>
                                                    )}
                                                    <button 
                                                        onClick={() => toggleStar(task.id, task.is_starred)}
                                                        className="absolute top-4 right-4 text-slate-300 hover:text-amber-500 transition-colors"
                                                    >
                                                        <i data-lucide="star" className={`w-5 h-5 ${task.is_starred ? 'text-amber-500 fill-amber-500' : ''}`}></i>
                                                    </button>

                                                    <div>
                                                        <div className="flex items-center gap-2 mb-3 pr-12">
                                                            <span className={`text-xs px-3 py-1 rounded-full font-bold ${priority.color}`}>
                                                                {priority.label}
                                                            </span>
                                                        </div>
                                                        <h3 onClick={() => setViewingTask(task)} className="font-bold text-slate-900 text-lg mb-2 cursor-pointer hover:text-indigo-600 line-clamp-1">
                                                            {task.title}
                                                        </h3>
                                                        <p className="text-slate-500 text-sm mb-4 line-clamp-2">{task.description || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                                                        
                                                        <div className="space-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-3 mb-4">
                                                            <div className="flex items-center gap-2"><i data-lucide="book" className="w-3.5 h-3.5 text-indigo-500"></i> วิชา: <span className="font-medium text-slate-800">{task.subject}</span></div>
                                                            <div className="flex items-center gap-2"><i data-lucide="user" className="w-3.5 h-3.5 text-indigo-500"></i> ครูผู้สอน: <span className="font-medium text-slate-800">{task.teacher}</span></div>
                                                            <div className="flex items-center gap-2"><i data-lucide="calendar" className="w-3.5 h-3.5 text-indigo-500"></i> กำหนดส่ง: <span className="font-medium text-slate-800">{task.due_date}</span></div>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-2 pt-2 border-t border-slate-100">
                                                        <button 
                                                            onClick={() => setCompletingTask(task)}
                                                            className="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all"
                                                        >
                                                            <i data-lucide="check" className="w-4 h-4"></i> เสร็จแล้ว
                                                        </button>
                                                        <button 
                                                            onClick={() => openEditModal(task)}
                                                            className="p-2 hover:bg-slate-100 text-slate-500 rounded-xl transition-all"
                                                            title="แก้ไข"
                                                        >
                                                            <i data-lucide="edit-3" className="w-4 h-4"></i>
                                                        </button>
                                                        <button 
                                                            onClick={() => moveToTrash(task.id)}
                                                            className="p-2 hover:bg-red-50 text-red-500 rounded-xl transition-all"
                                                            title="ลบ"
                                                        >
                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>
                        )}

                        {/* 2. เสร็จแล้ว (Completed Tab) */}
                        {activeTab === 'completed' && (
                            <div>
                                <div className="flex flex-col sm:flex-row gap-4 mb-6">
                                    <div className="relative flex-1">
                                        <i data-lucide="search" className="absolute left-3.5 top-3.5 w-5 h-5 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="ค้นหางานที่เสร็จแล้ว..." 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-11 pr-4 py-3 bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm"
                                        />
                                    </div>
                                    <select 
                                        value={completedSort}
                                        onChange={(e) => setCompletedSort(e.target.value)}
                                        className="bg-white px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
                                    >
                                        <option value="latest">เรียงตาม: ล่าสุดขึ้นก่อน</option>
                                        <option value="subject">เรียงตาม: รายวิชา</option>
                                        <option value="teacher">เรียงตาม: ครูผู้สอน</option>
                                    </select>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {todos
                                        .filter(t => t.is_completed && !t.is_deleted)
                                        .filter(t => 
                                            t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                            t.subject.toLowerCase().includes(searchQuery.toLowerCase())
                                        )
                                        .sort((a, b) => {
                                            if (completedSort === 'latest') return new Date(b.completed_at) - new Date(a.completed_at);
                                            if (completedSort === 'subject') return a.subject.localeCompare(b.subject);
                                            if (completedSort === 'teacher') return a.teacher.localeCompare(b.teacher);
                                            return 0;
                                        })
                                        .map(task => (
                                            <div key={task.id} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-3">
                                                        <span className="text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center gap-1">
                                                            <i data-lucide="check-circle" className="w-3.5 h-3.5"></i> เสร็จสมบูรณ์
                                                        </span>
                                                    </div>
                                                    <h3 onClick={() => setViewingTask(task)} className="font-bold text-slate-900 text-lg mb-2 cursor-pointer hover:text-indigo-600 line-clamp-1">
                                                        {task.title}
                                                    </h3>
                                                    <p className="text-slate-500 text-sm mb-4 line-clamp-2">{task.description || 'ไม่มีรายละเอียด'}</p>

                                                    <div className="space-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-3 mb-4">
                                                        <div>วิชา: <span className="font-medium text-slate-800">{task.subject}</span></div>
                                                        <div>ครูผู้สอน: <span className="font-medium text-slate-800">{task.teacher}</span></div>
                                                        <div>ส่งเมื่อ: <span className="font-medium text-slate-800">{new Date(task.completed_at).toLocaleString('th-TH')}</span></div>
                                                        {task.completion_notes && <div className="text-emerald-600 italic">"{task.completion_notes}"</div>}
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={() => moveToTrash(task.id)}
                                                    className="w-full bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all"
                                                >
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i> ย้ายไปถังขยะ
                                                </button>
                                            </div>
                                        ))}
                                </div>
                            </div>
                        )}

                        {/* 3. รายวิชา (Subjects Tab) */}
                        {activeTab === 'subjects' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {subjects.map(sub => {
                                    const subTodos = todos.filter(t => t.subject === sub.name && !t.is_deleted);
                                    const pendingCount = subTodos.filter(t => !t.is_completed).length;
                                    const completedCount = subTodos.filter(t => t.is_completed).length;
                                    const teachersForSub = [...new Set(subTodos.map(t => t.teacher))].join(', ') || 'ไม่ระบุ';

                                    return (
                                        <div key={sub.id} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                            <h3 className="text-xl font-bold text-slate-900 mb-1">{sub.name}</h3>
                                            <p className="text-xs text-slate-500 mb-4 flex items-center gap-1"><i data-lucide="user" className="w-3.5 h-3.5"></i> ครูผู้สอน: {teachersForSub}</p>
                                            
                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                <div className="bg-indigo-50 p-3 rounded-xl">
                                                    <div className="text-xs text-indigo-600 font-medium">ยังไม่เสร็จ</div>
                                                    <div className="text-2xl font-bold text-indigo-700">{pendingCount}</div>
                                                </div>
                                                <div className="bg-emerald-50 p-3 rounded-xl">
                                                    <div className="text-xs text-emerald-600 font-medium">เสร็จแล้ว</div>
                                                    <div className="text-2xl font-bold text-emerald-700">{completedCount}</div>
                                                </div>
                                            </div>
                                            <div className="text-xs text-slate-500 text-right">รวมทั้งหมด {subTodos.length} งาน</div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* 4. ปฏิทิน (Calendar Tab) */}
                        {activeTab === 'calendar' && (
                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                <h3 className="text-lg font-bold text-slate-900 mb-4">ปฏิทินภาระงาน (จุดสีตามความเร่งด่วน)</h3>
                                <div className="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400 mb-2">
                                    <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
                                </div>
                                <div className="grid grid-cols-7 gap-2">
                                    {Array.from({ length: 35 }).map((_, index) => {
                                        const dayNum = index - 3; // จำลองปฏิทินรายเดือนแบบกระชับ
                                        const dateStr = `2026-10-${dayNum > 0 && dayNum <= 31 ? (dayNum < 10 ? '0' + dayNum : dayNum) : '01'}`;
                                        const dayTasks = todos.filter(t => t.due_date === dateStr && !t.is_completed && !t.is_deleted);

                                        return (
                                            <div key={index} className="h-24 bg-slate-50 rounded-xl p-2 border border-slate-100 flex flex-col justify-between overflow-hidden">
                                                <span className="text-xs font-bold text-slate-500">{dayNum > 0 && dayNum <= 31 ? dayNum : ''}</span>
                                                <div className="flex flex-wrap gap-1 items-center justify-center">
                                                    {dayTasks.map(t => {
                                                        const p = getPriorityInfo(t.due_date);
                                                        return (
                                                            <div key={t.id} title={t.title} className={`w-3.5 h-3.5 rounded-full ${p.color} flex items-center justify-center text-[8px] font-bold relative`}>
                                                                {t.is_starred && <span className="absolute -top-1 -right-1 text-amber-500">★</span>}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* 5. ถังขยะ (Trash Tab) */}
                        {activeTab === 'trash' && (
                            <div>
                                <p className="text-xs text-slate-500 mb-4">* งานในถังขยะจะถูกลบถาวรอัตโนมัติเมื่อครบ 30 วัน</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {todos.filter(t => t.is_deleted).map(task => (
                                        <div key={task.id} className="bg-white rounded-2xl p-5 shadow-sm border border-red-100 flex flex-col justify-between">
                                            <div>
                                                <h3 className="font-bold text-slate-900 text-lg mb-1">{task.title}</h3>
                                                <p className="text-xs text-red-500 mb-4">ลบเมื่อ: {new Date(task.deleted_at).toLocaleDateString('th-TH')}</p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button 
                                                    onClick={() => restoreFromTrash(task.id)}
                                                    className="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 rounded-xl text-xs font-semibold"
                                                >
                                                    กู้คืน
                                                </button>
                                                <button 
                                                    onClick={() => deletePermanent(task.id)}
                                                    className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-xs font-semibold"
                                                >
                                                    ลบถาวร
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL: เพิ่ม/แก้ไขงาน */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h2 className="text-xl font-bold text-slate-900 mb-4">{editingTask ? 'แก้ไขงาน' : 'เพิ่มงานใหม่'}</h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">ชื่องาน *</label>
                                        <input type="text" value={title} onChange={e => setTitle(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="เช่น การบ้านฟิสิกส์ ข้อ 1-10" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">รายวิชา *</label>
                                        <input type="text" list="subject-list" value={subject} onChange={e => setSubject(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="เลือกหรือพิมพ์ชื่อวิชา" />
                                        <datalist id="subject-list">{subjects.map(s => <option key={s.id} value={s.name} />)}</datalist>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">ครูผู้สอน *</label>
                                        <input type="text" list="teacher-list" value={teacher} onChange={e => setTeacher(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="เลือกหรือพิมพ์ชื่อครูผู้สอน" />
                                        <datalist id="teacher-list">{teachers.map(t => <option key={t.id} value={t.name} />)}</datalist>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">วันกำหนดส่ง *</label>
                                        <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">รายละเอียดเพิ่มเติม</label>
                                        <textarea value={description} onChange={e => setDescription(e.target.value)} rows="3" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="รายละเอียดหรือโน้ตเพิ่มเติม"></textarea>
                                    </div>
                                </div>
                                <div className="flex items-center justify-end gap-3 mt-6">
                                    <button onClick={closeModal} className="px-4 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">ยกเลิก</button>
                                    <button onClick={() => handleSaveTask(true)} className="px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold">บันทึกเป็นโครงร่าง</button>
                                    <button onClick={() => handleSaveTask(false)} className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-lg shadow-indigo-200">บันทึกงาน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: ยืนยันงานเสร็จ */}
                    {completingTask && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
                                <h2 className="text-xl font-bold text-slate-900 mb-2">ยืนยันงานเสร็จสมบูรณ์</h2>
                                <p className="text-slate-500 text-sm mb-4">ส่งงาน: <span className="font-semibold text-slate-800">{completingTask.title}</span></p>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 block mb-1">ข้อความเพิ่มเติม (ถ้ามี)</label>
                                        <textarea value={compNotes} onChange={e => setCompNotes(e.target.value)} placeholder="เช่น ส่งครูทาง Google Classroom เรียบร้อย" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none" rows="2"></textarea>
                                    </div>
                                </div>
                                <div className="flex items-center justify-end gap-3 mt-6">
                                    <button onClick={() => setCompletingTask(null)} className="px-4 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">ยกเลิก</button>
                                    <button onClick={handleCompleteConfirm} className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-lg shadow-emerald-200">ยืนยันว่าเสร็จแล้ว</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: ดูรายละเอียดแบบเต็ม */}
                    {viewingTask && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl">
                                <h2 className="text-2xl font-bold text-slate-900 mb-2">{viewingTask.title}</h2>
                                <div className="space-y-3 text-sm text-slate-600 my-4 border-y border-slate-100 py-4">
                                    <div><strong className="text-slate-800">วิชา:</strong> {viewingTask.subject}</div>
                                    <div><strong className="text-slate-800">ครูผู้สอน:</strong> {viewingTask.teacher}</div>
                                    <div><strong className="text-slate-800">กำหนดส่ง:</strong> {viewingTask.due_date}</div>
                                    <div><strong className="text-slate-800">รายละเอียด:</strong> {viewingTask.description || 'ไม่มีรายละเอียด'}</div>
                                    {viewingTask.completion_notes && <div><strong className="text-emerald-600">โน้ตตอนส่ง:</strong> {viewingTask.completion_notes}</div>}
                                </div>
                                <button onClick={() => setViewingTask(null)} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-semibold text-sm">ปิดหน้าต่าง</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
