<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการคำใบ้</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- โหลด Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- โหลด React แบบไม่ต้อง Build -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 1. เชื่อมต่อ Supabase
        const SUPABASE_URL = 'https://ewbqsjoniqxantjevkvq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3YnFzam9uaXF4YW50amV2a3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTA0ODAsImV4cCI6MjEwOTE2NjQ4MH0.Qc7VKzku43uqV1m8Wv8nh3vUBmPojIdIHUnT9nCkg_M';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. ระบบจัดการ Database
        const useDatabase = () => {
            const [hints, setHints] = useState({});
            const [history, setHistory] = useState([]);

            const fetchAllData = async () => {
                const { data: hintsData } = await supabase.from('hints').select('*');
                const { data: historyData } = await supabase.from('hint_history').select('*');

                if (hintsData) {
                    const hintsObj = {};
                    hintsData.forEach(item => {
                        hintsObj[item.sm_code] = {
                            id: item.sm_code,
                            text: item.message || '',
                            images: [item.image_1_url, item.image_2_url].filter(Boolean),
                            deleted: item.is_deleted,
                            updatedAt: item.updated_at
                        };
                    });
                    setHints(hintsObj);
                }

                if (historyData) {
                    const mappedHistory = historyData.map(item => ({
                        logId: item.id,
                        id: item.sm_code,
                        action: item.action,
                        timestamp: item.created_at,
                        details: item.action.includes('DELETED') ? 'ลบข้อมูล' : 
                                 item.action === 'RESTORED' ? 'กู้คืนข้อมูล' : 'อัปเดตคำใบ้/รูปภาพ'
                    }));
                    setHistory(mappedHistory);
                }
            };

            useEffect(() => { fetchAllData(); }, []);

            const saveHint = async (id, text, images) => {
                const img1 = images[0] || null;
                const img2 = images[1] || null;
                
                await supabase.from('hints').upsert({
                    sm_code: id, message: text, image_1_url: img1, image_2_url: img2,
                    is_deleted: false, updated_at: new Date().toISOString()
                }, { onConflict: 'sm_code' });

                await supabase.from('hint_history').insert({
                    sm_code: id, action: 'UPDATED', message_snapshot: text,
                    image_1_snapshot: img1, image_2_snapshot: img2
                });
                fetchAllData();
            };

            const softDeleteHint = async (id) => {
                await supabase.from('hints').update({ is_deleted: true, updated_at: new Date().toISOString() }).eq('sm_code', id);
                await supabase.from('hint_history').insert({ sm_code: id, action: 'DELETED' });
                fetchAllData();
            };

            const restoreHint = async (id) => {
                await supabase.from('hints').update({ is_deleted: false, updated_at: new Date().toISOString() }).eq('sm_code', id);
                await supabase.from('hint_history').insert({ sm_code: id, action: 'RESTORED' });
                fetchAllData();
            };

            const hardDeleteHint = async (id) => {
                await supabase.from('hints').delete().eq('sm_code', id);
                await supabase.from('hint_history').insert({ sm_code: id, action: 'HARD_DELETED' });
                fetchAllData();
            };

            return { hints, history, saveHint, softDeleteHint, restoreHint, hardDeleteHint };
        };

        // 3. Components
        const Button = ({ children, onClick, variant = 'primary', className = '', icon, disabled = false }) => {
            const baseStyle = "flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm hover:shadow-md";
            const variants = {
                primary: "bg-blue-600 hover:bg-blue-700 text-white",
                secondary: "bg-white hover:bg-slate-100 text-blue-900 border border-slate-200",
                danger: "bg-red-600 hover:bg-red-700 text-white",
                outlineDanger: "bg-white hover:bg-red-50 text-red-600 border border-red-200"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {icon && <i className={icon}></i>}
                    {children}
                </button>
            );
        };

        // 4. Main App
        const App = () => {
            const [currentView, setCurrentView] = useState('home'); 
            const [currentId, setCurrentId] = useState('');
            const [adminAuthenticated, setAdminAuthenticated] = useState(false);
            const [fullScreenImage, setFullScreenImage] = useState(null);
            const [toast, setToast] = useState({ visible: false, message: '', type: 'success' });
            
            const { hints, history, saveHint, softDeleteHint, restoreHint, hardDeleteHint } = useDatabase();

            const showToast = (message, type = 'success') => {
                setToast({ visible: true, message, type });
                setTimeout(() => setToast({ visible: false, message: '', type: 'success' }), 3000);
            };

            // --- Home View ---
            const HomeView = () => {
                const [inputId, setInputId] = useState('');
                const [error, setError] = useState('');

                const validateAndProceed = (nextView) => {
                    const trimmedId = inputId.trim().toUpperCase();
                    if (inputId.includes(' ') || !/^SM\d{2}$/.test(trimmedId)) {
                        setError('รูปแบบรหัสไม่ถูกต้อง (เช่น SM01 ห้ามเว้นวรรค)');
                        return;
                    }
                    setError('');
                    setCurrentId(trimmedId);
                    setCurrentView(nextView);
                };

                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4">
                        <div className="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
                            <div className="flex justify-center mb-6 text-blue-600">
                                <i className="fas fa-user text-4xl p-4 bg-blue-50 rounded-full"></i>
                            </div>
                            <h1 className="text-2xl font-bold text-center text-blue-900 mb-2">ระบบจัดการคำใบ้</h1>
                            <p className="text-center text-slate-500 mb-8 text-sm">กรุณากรอกรหัสประจำตัวของคุณเพื่อดำเนินการต่อ</p>
                            
                            <div className="space-y-4">
                                <div>
                                    <input type="text" placeholder="เช่น SM01, SM22" value={inputId}
                                        onChange={(e) => { setInputId(e.target.value.toUpperCase()); setError(''); }}
                                        className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 uppercase" maxLength={4} />
                                    {error && <p className="text-red-500 text-xs mt-2"><i className="fas fa-exclamation-triangle"></i> {error}</p>}
                                </div>
                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <Button onClick={() => validateAndProceed('submit')} variant="primary">กรอก/แก้ไข</Button>
                                    <Button onClick={() => validateAndProceed('view')} variant="secondary">ดูคำใบ้</Button>
                                </div>
                            </div>
                            <div className="mt-12 text-center border-t pt-6">
                                <button onClick={() => setCurrentView('admin-login')} className="text-sm text-slate-400 hover:text-blue-600 transition-colors">
                                    <i className="fas fa-shield-alt"></i> ผู้ดูแลระบบ (Admin)
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- Submit View ---
            const SubmitHintView = () => {
                const existingHint = hints[currentId];
                const [text, setText] = useState(existingHint?.text || '');
                const [images, setImages] = useState(existingHint?.images || []);
                const [isSaving, setIsSaving] = useState(false);
                const fileInputRef = useRef(null);

                const handleImageUpload = (e) => {
                    const files = Array.from(e.target.files);
                    if (images.length + files.length > 2) return showToast('สูงสุด 2 ภาพ', 'error');
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onloadend = () => setImages(prev => [...prev, reader.result].slice(0, 2));
                        if (file) reader.readAsDataURL(file);
                    });
                };

                const handleSave = async () => {
                    if (!text.trim() && images.length === 0) return showToast('กรุณากรอกข้อความหรือแนบรูป', 'error');
                    setIsSaving(true);
                    await saveHint(currentId, text, images);
                    setIsSaving(false);
                    showToast('บันทึกเรียบร้อย');
                    setTimeout(() => setCurrentView('home'), 1500);
                };

                return (
                    <div className="min-h-screen p-4 md:p-8 max-w-2xl mx-auto">
                        <button onClick={() => setCurrentView('home')} className="mb-6 text-slate-500 hover:text-blue-600"><i className="fas fa-chevron-left"></i> กลับหน้าหลัก</button>
                        <div className="bg-white rounded-2xl shadow-lg p-6 md:p-8">
                            <h2 className="text-xl font-bold text-blue-900 mb-6 flex justify-between border-b pb-4">
                                <span><i className="fas fa-edit"></i> จัดการคำใบ้</span>
                                <span className="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">{currentId}</span>
                            </h2>
                            <textarea rows="4" value={text} onChange={(e) => setText(e.target.value)} placeholder="พิมพ์คำใบ้ที่นี่..." className="w-full px-4 py-3 border rounded-lg mb-4"></textarea>
                            
                            <input type="file" accept="image/*" multiple ref={fileInputRef} className="hidden" onChange={handleImageUpload} />
                            {images.length < 2 && (
                                <button onClick={() => fileInputRef.current?.click()} className="w-full py-8 border-2 border-dashed rounded-lg text-slate-500 hover:text-blue-600 mb-4">
                                    <i className="fas fa-upload text-2xl mb-2 block"></i> เพิ่มรูปภาพ ({images.length}/2)
                                </button>
                            )}
                            
                            <div className="grid grid-cols-2 gap-4 mb-6">
                                {images.map((img, idx) => (
                                    <div key={idx} className="relative rounded-lg overflow-hidden border">
                                        <img src={img} className="w-full h-32 object-cover" />
                                        <button onClick={() => setImages(images.filter((_, i) => i !== idx))} className="absolute top-2 right-2 bg-red-600 text-white p-2 rounded-full text-xs"><i className="fas fa-trash"></i></button>
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-end">
                                <Button onClick={handleSave} icon="fas fa-save" disabled={isSaving}>{isSaving ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}</Button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- User View ---
            const UserHintView = () => {
                const hint = hints[currentId];
                return (
                    <div className="min-h-screen p-4 md:p-8 max-w-2xl mx-auto">
                        <button onClick={() => setCurrentView('home')} className="mb-6 text-slate-500 hover:text-blue-600"><i className="fas fa-chevron-left"></i> กลับหน้าหลัก</button>
                        <div className="bg-white rounded-2xl shadow-lg p-6 md:p-8">
                            <h2 className="text-xl font-bold text-blue-900 mb-6 flex justify-between border-b pb-4">
                                <span><i className="fas fa-eye"></i> ข้อมูลคำใบ้</span>
                                <span className="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">{currentId}</span>
                            </h2>
                            {(!hint || hint.deleted) ? (
                                <div className="text-center py-12 text-slate-400">ไม่พบข้อมูลคำใบ้</div>
                            ) : (
                                <div>
                                    {hint.text && <div className="bg-slate-50 p-4 rounded-lg mb-4 whitespace-pre-wrap">{hint.text}</div>}
                                    <div className="grid grid-cols-2 gap-4">
                                        {hint.images?.map((img, idx) => (
                                            <img key={idx} src={img} onClick={() => setFullScreenImage(img)} className="w-full h-48 object-cover rounded-lg cursor-pointer border" />
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // --- Admin Login ---
            const AdminLoginView = () => {
                const [pwd, setPwd] = useState('');
                const [err, setErr] = useState('');
                const login = (e) => {
                    e.preventDefault();
                    if (pwd === '@SM_12345') { setAdminAuthenticated(true); setCurrentView('admin-panel'); }
                    else setErr('รหัสไม่ถูกต้อง');
                };
                return (
                    <div className="flex items-center justify-center min-h-screen bg-slate-900 p-4">
                        <div className="w-full max-w-md bg-white rounded-2xl p-8">
                            <button onClick={() => setCurrentView('home')} className="mb-6 text-sm text-slate-500"><i className="fas fa-chevron-left"></i> กลับหน้าหลัก</button>
                            <h1 className="text-2xl font-bold text-center mb-6"><i className="fas fa-shield-alt text-blue-600"></i> ผู้ดูแลระบบ</h1>
                            <form onSubmit={login}>
                                <input type="password" value={pwd} onChange={e => {setPwd(e.target.value); setErr('');}} placeholder="รหัสผ่าน" className="w-full px-4 py-3 border rounded-lg mb-2" />
                                {err && <p className="text-red-500 text-sm mb-4">{err}</p>}
                                <Button type="submit" className="w-full !bg-slate-900">เข้าสู่ระบบ</Button>
                            </form>
                        </div>
                    </div>
                );
            };

            // --- Admin Panel ---
            const AdminPanelView = () => {
                const [search, setSearch] = useState('');
                const [showTrash, setShowTrash] = useState(false);
                const allIds = Array.from({ length: 38 }, (_, i) => `SM${String(i + 1).padStart(2, '0')}`);
                const filtered = allIds.filter(id => id.includes(search.toUpperCase()));

                return (
                    <div className="min-h-screen bg-slate-100 pb-12">
                        <header className="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-40">
                            <h1 className="font-bold"><i className="fas fa-shield-alt text-blue-400"></i> Admin Panel</h1>
                            <div className="flex gap-2">
                                <button onClick={() => setShowTrash(!showTrash)} className="px-4 py-2 bg-slate-800 rounded-lg text-sm">{showTrash ? 'ซ่อนถังขยะ' : 'ดูถังขยะ'}</button>
                                <button onClick={() => { setAdminAuthenticated(false); setCurrentView('home'); }} className="px-4 py-2 bg-red-600 rounded-lg text-sm"><i className="fas fa-sign-out-alt"></i> ออก</button>
                            </div>
                        </header>
                        <div className="max-w-6xl mx-auto px-4 mt-6">
                            <input type="text" placeholder="ค้นหารหัส (SM01)..." value={search} onChange={e => setSearch(e.target.value)} className="w-full md:w-72 px-4 py-2 rounded-full border mb-6 uppercase" />
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {filtered.map(id => {
                                    const h = hints[id];
                                    if (showTrash && !h?.deleted) return null;
                                    if (!showTrash && h?.deleted) return null;
                                    if (showTrash && !h) return null;

                                    return (
                                        <div key={id} className={`bg-white rounded-xl border p-4 ${h ? 'border-blue-200' : 'opacity-60'}`}>
                                            <div className="flex justify-between items-center mb-3">
                                                <span className="font-bold text-lg bg-slate-100 px-3 py-1 rounded">{id}</span>
                                                {h && <span className="text-xs text-blue-600 bg-blue-100 px-2 py-1 rounded-full"><i className="fas fa-check"></i> มีข้อมูล</span>}
                                            </div>
                                            {h && (
                                                <div>
                                                    <p className="text-sm bg-slate-50 p-2 rounded mb-2 h-16 overflow-hidden">{h.text}</p>
                                                    <div className="flex gap-2 mb-3">
                                                        {h.images?.map((img, i) => <img key={i} src={img} className="w-10 h-10 object-cover rounded cursor-pointer" onClick={()=>setFullScreenImage(img)} />)}
                                                    </div>
                                                    <div className="flex justify-end gap-2 border-t pt-3">
                                                        <button onClick={() => { setCurrentId(id); setCurrentView('admin-history'); }} className="text-xs bg-slate-200 px-2 py-1 rounded"><i className="fas fa-history"></i> ประวัติ</button>
                                                        {!h.deleted ? (
                                                            <button onClick={() => { if(prompt('พิมพ์ @SM_12345 เพื่อลบ')==='@SM_12345') softDeleteHint(id); }} className="text-xs bg-red-100 text-red-600 px-2 py-1 rounded"><i className="fas fa-trash"></i> ลบ</button>
                                                        ) : (
                                                            <>
                                                                <button onClick={() => restoreHint(id)} className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded"><i className="fas fa-undo"></i> กู้คืน</button>
                                                                <button onClick={() => { if(prompt('พิมพ์ @SM_12345 เพื่อลบถาวร')==='@SM_12345') hardDeleteHint(id); }} className="text-xs bg-red-600 text-white px-2 py-1 rounded"><i className="fas fa-trash-alt"></i> ลบถาวร</button>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            // --- Admin History ---
            const AdminHistoryView = () => {
                const logs = history.filter(h => h.id === currentId).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                return (
                    <div className="min-h-screen p-4 max-w-3xl mx-auto">
                        <button onClick={() => setCurrentView('admin-panel')} className="mb-6 text-sm text-slate-500"><i className="fas fa-chevron-left"></i> กลับ</button>
                        <h2 className="text-xl font-bold mb-4">ประวัติของ {currentId}</h2>
                        <div className="bg-white rounded-xl shadow p-6">
                            {logs.length === 0 ? <p className="text-slate-400">ไม่มีประวัติ</p> : (
                                <div className="space-y-4">
                                    {logs.map((log, i) => (
                                        <div key={i} className="border-l-4 border-blue-500 pl-4 py-2 bg-slate-50 rounded-r-lg">
                                            <div className="flex justify-between">
                                                <span className="font-bold text-sm">{log.action}</span>
                                                <span className="text-xs text-slate-400">{new Date(log.timestamp).toLocaleString('th-TH')}</span>
                                            </div>
                                            <p className="text-sm mt-1">{log.details}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div>
                    {currentView === 'home' && <HomeView />}
                    {currentView === 'submit' && <SubmitHintView />}
                    {currentView === 'view' && <UserHintView />}
                    {currentView === 'admin-login' && <AdminLoginView />}
                    {currentView === 'admin-panel' && <AdminPanelView />}
                    {currentView === 'admin-history' && <AdminHistoryView />}
                    
                    {fullScreenImage && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4" onClick={() => setFullScreenImage(null)}>
                            <img src={fullScreenImage} className="max-w-full max-h-full rounded-lg" />
                        </div>
                    )}

                    <div className={`fixed bottom-6 right-6 transition-all duration-300 ${toast.visible ? 'opacity-100' : 'opacity-0 pointer-events-none'} z-50`}>
                        <div className={`px-6 py-4 rounded-xl shadow-xl text-white ${toast.type === 'error' ? 'bg-red-600' : 'bg-slate-900'}`}>
                            {toast.message}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
